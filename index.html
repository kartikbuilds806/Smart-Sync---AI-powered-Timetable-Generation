<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSync - College Timetable Management System</title>
  <meta name="description" content="SmartSync is an automated college timetable management system for Administrators, Faculty, and Students.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SmartSync Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css?v=3.6">
  <link rel="stylesheet" href="css/base.css?v=3.6">
  <link rel="stylesheet" href="css/layout.css?v=3.6">
  <link rel="stylesheet" href="css/components.css?v=3.6">
  <link rel="stylesheet" href="css/pages.css?v=3.6">
  <link rel="stylesheet" href="css/responsive.css?v=3.6">

  <!-- SmartSync Authentication Guard: Require Sign In / Sign Up Before Dashboard Access -->
  <script>
    (function() {
      try {
        var session = localStorage.getItem('smartsync_session_profile');
        if (!session) {
          window.location.replace('pages/login.html');
        }
      } catch (e) {
        window.location.replace('pages/login.html');
      }
    })();
  </script>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar Navigation Shell -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i data-lucide="graduation-cap" style="width: 22px; height: 22px;"></i>
        </div>
        <div class="brand-text">
          <h2>SmartSync</h2>
          <span>College Timetable</span>
        </div>
        <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close Navigation Sidebar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-list">
        <!-- Dynamically rendered by navigation.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-quote-card">
          <p id="sidebar-quote-text">“Automate timetable generation, resolve conflicts, and keep everyone in sync.”</p>
        </div>
      </div>
    </aside>

    <!-- Main Application Shell -->
    <main class="app-main">

      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-left d-flex align-items-center gap-3">
          <!-- Mobile Hamburger Toggle Button -->
          <button id="topbar-sidebar-toggle-btn" class="topbar-hamburger-btn" aria-label="Toggle Menu Drawer">
            <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
          </button>
          
          <div class="topbar-search d-none d-lg-block">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" placeholder="Search classes, subjects, rooms..." aria-label="Search">
          </div>
        </div>

        <div class="topbar-right d-flex align-items-center gap-3 ms-auto">
          <!-- Demo Role Switcher -->
          <div class="role-switcher-container">
            <select id="global-role-switcher" class="role-switcher-select" aria-label="Select Role Profile">
              <option value="admin">Admin Coordinator</option>
              <option value="teacher">Faculty / Teacher</option>
              <option value="student">Student</option>
            </select>
          </div>

          <!-- Notification Bell & Dropdown Tray -->
          <div class="topbar-notification-wrapper" id="topbar-notif-wrapper">
            <button id="topbar-notification-btn" class="topbar-icon-btn" aria-label="Notifications" title="View Notifications" onclick="window.toggleNotificationTray(event)">
              <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
              <span id="topbar-notification-badge" class="notification-badge-counter">4</span>
            </button>
            <div id="topbar-notification-dropdown" class="notification-dropdown-menu" style="display: none;">
              <!-- Dynamically populated via window.renderNotificationTray() -->
            </div>
          </div>

          <!-- User Profile Pill & Dropdown -->
          <div class="user-profile-wrapper position-relative">
            <div class="user-profile-pill" id="topbar-user-pill" onclick="window.toggleUserMenu(event)">
              <div class="user-avatar" id="topbar-user-avatar">A</div>
              <div class="user-info d-none d-lg-flex">
                <span class="user-name" id="topbar-user-name">Admin Coordinator</span>
                <span class="user-role" id="topbar-user-role">Academic Affairs</span>
              </div>
              <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: #64748b; margin-left: 2px;"></i>
            </div>
            <div id="topbar-user-menu" class="user-dropdown-menu" style="display: none;">
              <div class="user-dropdown-header">
                <div class="fw-bold text-dark" id="user-dropdown-fullname">Academic Administrator</div>
                <div class="small text-muted text-truncate" style="max-width: 180px;" id="user-dropdown-email">admin@gehu.edu.in</div>
              </div>
              <div class="dropdown-divider my-1"></div>
              <a href="pages/login.html" class="user-dropdown-item text-danger d-flex align-items-center gap-2" onclick="event.preventDefault(); window.SmartAuth ? window.SmartAuth.logout() : window.location.href='pages/login.html';">
                <i data-lucide="log-out" style="width: 15px; height: 15px;"></i> Sign Out
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Body Content -->
      <div class="app-content" id="main-app-content">
        <!-- Dynamically rendered via main.js and SmartViews -->
      </div>

    </main>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SmartSync Application Scripts -->
  <script src="js/config.js"></script>
  <script src="data/real-dataset.js"></script>
  <script src="data/timetable-data.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/services/dataService.js"></script>
  <script src="js/services/timetableService.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/engine/constraintEngine.js"></script>
  <script src="js/engine/conflictResolver.js"></script>
  <script src="js/generatorWizard.js"></script>
  <script src="js/crudModals.js"></script>
  <script src="js/views.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
