<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSync - College Timetable Management System</title>
  <meta name="description" content="SmartSync is an automated college timetable management system for Administrators, Faculty, and Students.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SmartSync Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div class="app-container">

    <!-- Mobile Header -->
    <header class="mobile-header">
      <div class="d-flex align-items-center gap-2">
        <button id="sidebar-toggle-btn" class="btn text-white p-0" aria-label="Toggle Sidebar">
          <i data-lucide="menu"></i>
        </button>
        <div class="brand-logo" style="width: 30px; height: 30px;">
          <i data-lucide="graduation-cap" style="width: 18px; height: 18px;"></i>
        </div>
        <strong class="text-white">SmartSync</strong>
      </div>
      <a href="pages/login.html" class="btn btn-sm btn-light font-weight-bold">Demo Login</a>
    </header>

    <!-- Sidebar Navigation Shell -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i data-lucide="graduation-cap" style="width: 22px; height: 22px;"></i>
        </div>
        <div class="brand-text">
          <h2>SmartSync</h2>
          <span>College Timetable</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-list">
        <!-- Dynamically rendered by navigation.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-quote-card">
          <p id="sidebar-quote-text">“Automate timetable generation, resolve conflicts, and keep everyone in sync.”</p>
        </div>
      </div>
    </aside>

    <!-- Main Application Shell -->
    <main class="app-main">

      <!-- Topbar Header -->
      <header class="app-topbar">
        <div class="topbar-search">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" placeholder="Search classes, subjects, rooms..." aria-label="Search">
        </div>

        <div class="topbar-right">
          <!-- Demo Role Switcher -->
          <div class="d-flex align-items-center gap-2">
            <span class="text-muted small d-none d-md-inline" style="font-size: 0.775rem;">Switch Role:</span>
            <select id="global-role-switcher" class="role-switcher-select" aria-label="Select Role Profile">
              <option value="admin">Admin Coordinator</option>
              <option value="teacher">Faculty / Teacher</option>
              <option value="student">Student</option>
            </select>
          </div>

          <!-- Login Page Shortcut -->
          <a href="pages/login.html" class="btn-smart btn-smart-outline d-none d-md-inline-flex" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">
            <i data-lucide="log-in" style="width: 14px; height: 14px;"></i> Demo Login
          </a>

          <!-- Notification Bell -->
          <button class="topbar-icon-btn" aria-label="Notifications" title="View Notifications">
            <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
            <span class="notification-badge-dot"></span>
          </button>

          <!-- User Profile Pill -->
          <div class="user-profile-pill">
            <div class="user-avatar" id="topbar-user-avatar">A</div>
            <div class="user-info d-none d-sm-flex">
              <span class="user-name" id="topbar-user-name">Admin Coordinator</span>
              <span class="user-role" id="topbar-user-role">Academic Affairs</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Body Content -->
      <div class="app-content" id="main-app-content">
        <!-- Dynamically rendered via main.js and SmartViews -->
      </div>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <a href="#" onclick="loadView('dashboard'); return false;" class="text-primary d-flex flex-column align-items-center" style="font-size: 0.7rem;">
        <i data-lucide="home" style="width: 20px; height: 20px;"></i> Home
      </a>
      <a href="#" onclick="loadView('my-timetable'); return false;" class="text-muted d-flex flex-column align-items-center" style="font-size: 0.7rem;">
        <i data-lucide="calendar" style="width: 20px; height: 20px;"></i> Timetable
      </a>
      <a href="#" onclick="loadView('profile'); return false;" class="text-muted d-flex flex-column align-items-center" style="font-size: 0.7rem;">
        <i data-lucide="user" style="width: 20px; height: 20px;"></i> Profile
      </a>
      <a href="pages/login.html" class="text-muted d-flex flex-column align-items-center" style="font-size: 0.7rem;">
        <i data-lucide="log-in" style="width: 20px; height: 20px;"></i> Login
      </a>
    </nav>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SmartSync Application Scripts -->
  <script src="data/real-dataset.js"></script>
  <script src="js/services/dataService.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/views.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
